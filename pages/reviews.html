<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews — Cottage Aesthetics</title>
<meta name="description" content="Genuine 5-star Google reviews for Cottage Aesthetics, nurse-led medical aesthetics in Hartlebury.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  .stars-hero{color:#e6b98f;font-size:1.3rem;letter-spacing:.12em;margin-top:.5rem}
  .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
  .rcard{background:#fbf5ea;border:1px solid var(--line);border-radius:6px;padding:1.9rem;display:flex;flex-direction:column}
  .rcard .stars{color:var(--brass);letter-spacing:.1em;margin-bottom:.8rem}
  .rcard .q{font-family:'Cormorant Garamond',serif;font-size:1.15rem;line-height:1.5;color:#463a31;flex:1}
  .rcard .q::before{content:"“";color:var(--clay);font-size:2rem;line-height:0;vertical-align:-.3em;margin-right:.1rem}
  .rcard .nm{margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.92rem;color:var(--coffee)}
  .rcard .src{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--coffee-soft)}
  @media(max-width:820px){.rgrid{grid-template-columns:1fr}}
</style>
</head>
<body data-page="reviews">

<!-- wx:partial header -->
<section class="page-hero">
  <p class="eyebrow">Kind words from The Cottage</p>
  <h1>Client Reviews</h1>
  <div class="stars-hero">★★★★★ &nbsp;5.0 on Google</div>
</section>

<section class="treat">
  <div class="wrap"><div class="rgrid" id="grid"></div></div>
</section>

<section class="cta-strip">
  <div class="wrap reveal">
    <h2>Come and experience it for yourself</h2>
    <a class="btn btn-primary js-book" href="#">Book a Free Consultation</a>
  </div>
</section>

<script src="site.js"></script>
<script>
const R=[
 {n:"Bev D.",t:"I visited Cottage Aesthetics for Jalupro Super Hydro Skin Boosters with Purdi and once again had a fantastic experience. Her clinic was as welcoming, beautiful and spotless as ever."},
 {n:"Sophie V.",t:"I had such a positive experience with Purdi. I accidentally arrived a day early and she still managed to fit me in — it says a lot about her care for her clients."},
 {n:"Lucy C.",t:"Skin boosters and botox at Cottage Aesthetics — couldn't be more impressed. Everything was explained so clearly, including the science, which made me feel completely informed and confident."},
 {n:"Taylor J.",t:"I recently had Botox at Cottage Aesthetics and couldn't be happier with the results! Professional, friendly and relaxing from start to finish. Purdi took her time to explain everything."},
 {n:"Lucy H.",t:"My first time having lip filler. I was quite worried but Purdi spent ages discussing what I wanted and any concerns I had. She really put me at ease."},
 {n:"Jennifer S.",t:"I felt truly listened to for the first time in my Botox journey — incredibly warm, welcoming and knowledgeable, and she tailors your treatment to you."},
 {n:"Laura L.",t:"A wonderful experience. From the moment I arrived I felt completely at ease. A truly lovely person — warm, reassuring and clearly very talented."},
 {n:"Ella S.",t:"The loveliest experience getting my first microneedling treatment. Purdi talked me through every step and made me feel really comfortable and relaxed."},
 {n:"Emma C.",t:"Purdi has done a fantastic job for me. I'd been to a couple of places before that weren't delivering results — she listened, and I'm thrilled. Would recommend her in a heartbeat!"}
];
var g=document.getElementById('grid');
R.forEach(function(r){g.insertAdjacentHTML('beforeend',
 '<article class="rcard"><div class="stars">★★★★★</div><p class="q">'+r.t+'”</p><div class="nm">'+r.n+'<br><span class="src">Google review</span></div></article>');});
</script>
<!-- wx:partial footer -->
<!-- wx:partial booking-modal -->
</body>
</html>
