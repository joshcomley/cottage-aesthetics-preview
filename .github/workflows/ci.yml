name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-build-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      # spec/independence/01 §3/C6. `vars.WIXY_ENGINE_REPO` lets a fork point CI
      # at ITS OWN copy of the engine (owner/repo, e.g. your-org/wixy-engine);
      # unset defaults to upstream joshcomley/wixy, which is what this repo
      # uses until you fork. The deploy key is scoped to upstream specifically
      # (it was issued read access to that ONE repo, back when it was private)
      # -- still supplied for the upstream case since it keeps working
      # unchanged whenever upstream's own visibility flips to public, but
      # deliberately OMITTED once WIXY_ENGINE_REPO points somewhere else: a
      # deploy key scoped to a different repo doesn't grant access there, and
      # a real fork of an MIT/public engine is public itself, so it needs no
      # auth at all to check out.
      - name: Checkout wixy engine
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WIXY_ENGINE_REPO || 'joshcomley/wixy' }}
          ssh-key: ${{ vars.WIXY_ENGINE_REPO == '' && secrets.WIXY_DEPLOY_KEY || '' }}
          path: wixy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install wixy builder (core deps only — no server extras needed here)
        working-directory: wixy
        run: pip install -e .

      - name: Install Playwright chromium (parity harness)
        run: playwright install --with-deps chromium

      - name: validate (spec/02 §10)
        run: python -m builder validate --root . --project wixy/projects/ca.json

      - name: build
        run: python -m builder build --root . --project wixy/projects/ca.json --out _build

      - name: rendered-parity check (spec/03 §5) — the pinned platform, strict screenshots
        run: >
          python -m builder parity
          --serve-root _build
          --slugs index,about,aftercare,contact,faq,gallery,policies,reviews,treatments
          --mobile-slugs index,treatments
          --baseline wixy/builder/tests/parity/baseline
          --strict-screenshots
