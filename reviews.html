<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews — Cottage Aesthetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F1E8D9;--cream-2:#EADFCB;--mocha:#5E4635;--coffee:#3E312A;--coffee-soft:#6B584C;
    --clay:#B26E4A;--clay-deep:#9A5C3B;--olive:#6E7357;--olive-deep:#565b43;--brass:#A98A54;--line:#d9c9ad;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Jost',sans-serif;color:var(--coffee);background:var(--cream);font-weight:300;line-height:1.7}
  h1,h2{font-family:'Cormorant Garamond',serif;font-weight:500;color:var(--mocha)}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 1.6rem}
  .btn{display:inline-block;padding:.7rem 1.5rem;border:1px solid var(--olive);color:var(--olive-deep);
    border-radius:2px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;transition:.25s}
  .btn:hover{background:var(--olive);color:#fff}
  header{background:var(--mocha);padding:1rem 0}
  .nav{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;flex-direction:column;line-height:1}
  .brand .b1{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.5rem;color:#fbf4e8}
  .brand .b2{font-size:.62rem;letter-spacing:.42em;text-transform:uppercase;color:#e7dcc6;margin-top:2px}
  .nav a.lnk{color:#f3ead9;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;margin-left:1.6rem}
  .nav a.lnk:hover{color:#e6b98f}
  .hero{background:var(--cream-2);text-align:center;padding:4.5rem 1.5rem 3rem}
  .eyebrow{font-size:.74rem;letter-spacing:.34em;text-transform:uppercase;color:var(--clay)}
  .hero h1{font-size:clamp(2.4rem,5vw,3.6rem);margin:.6rem 0 .4rem}
  .stars{color:var(--brass);letter-spacing:.12em}
  .grid{max-width:1100px;margin:0 auto;padding:3.5rem 1.6rem 5rem;
    display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
  .card{background:#fbf5ea;border:1px solid var(--line);border-radius:6px;padding:1.9rem;display:flex;flex-direction:column}
  .card .q{font-family:'Cormorant Garamond',serif;font-size:1.15rem;line-height:1.5;color:#463a31;flex:1}
  .card .q::before{content:"“";color:var(--clay);font-size:2rem;line-height:0;vertical-align:-.3em;margin-right:.1rem}
  .card .nm{margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.92rem;color:var(--coffee)}
  .card .src{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--coffee-soft)}
  .card .stars{margin-bottom:.8rem}
  footer{background:var(--coffee);color:#cbb89f;text-align:center;padding:2.2rem 1rem;font-size:.82rem}
  footer .script{font-family:'Pinyon Script',cursive;font-size:1.5rem;color:#e6b98f}
  @media(max-width:820px){.grid{grid-template-columns:1fr}.nav a.lnk{display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a href="index.html" class="brand"><span class="b1">Cottage</span><span class="b2">Aesthetics</span></a>
    <nav><a class="lnk" href="index.html">Home</a><a class="lnk" href="index.html#treatments">Treatments</a><a class="lnk" href="index.html#contact">Contact</a></nav>
  </div>
</header>
<section class="hero">
  <p class="eyebrow">Kind words from The Cottage</p>
  <h1>Client Reviews</h1>
  <div class="stars" style="font-size:1.3rem">★★★★★ &nbsp;5.0 on Google</div>
</section>
<div class="grid" id="grid"></div>
<footer>
  <div class="script">Cottage Aesthetics</div>
  <p style="margin-top:.5rem">Nurse-led medical aesthetics · Hartlebury, Worcestershire</p>
  <p style="margin-top:1rem"><a class="btn" href="index.html#contact">Book a free consultation</a></p>
</footer>
<script>
const R=[
 {n:"Bev D.",t:"I visited Cottage Aesthetics for Jalupro Super Hydro Skin Boosters with Purdi and once again had a fantastic experience. Her clinic was as welcoming, beautiful and spotless as ever."},
 {n:"Sophie V.",t:"I had such a positive experience with Purdi. I accidentally arrived a day early and she still managed to fit me in — it says a lot about her care for her clients."},
 {n:"Lucy C.",t:"Skin boosters and botox at Cottage Aesthetics — couldn't be more impressed. Everything was explained so clearly, including the science, which made me feel completely informed and confident."},
 {n:"Taylor J.",t:"I recently had Botox at Cottage Aesthetics and couldn't be happier with the results! Professional, friendly and relaxing from start to finish. Purdi took her time to explain everything."},
 {n:"Lucy H.",t:"My first time having lip filler. I was quite worried but Purdi spent ages discussing what I wanted and any concerns I had. She really put me at ease."},
 {n:"Jennifer S.",t:"I felt truly listened to for the first time in my Botox journey — incredibly warm, welcoming and knowledgeable, and she tailors your treatment to you."},
 {n:"Laura L.",t:"A wonderful experience. From the moment I arrived I felt completely at ease. A truly lovely person — warm, reassuring and clearly very talented."},
 {n:"Ella S.",t:"The loveliest experience getting my first microneedling treatment. Purdi talked me through every step and made me feel really comfortable and relaxed."},
 {n:"Emma C.",t:"Purdi has done a fantastic job for me. I'd been to a couple of places before that weren't delivering results — she listened, and I'm thrilled. Would recommend her in a heartbeat!"}
];
const g=document.getElementById('grid');
for(const r of R){g.insertAdjacentHTML('beforeend',
 `<article class="card"><div class="stars">★★★★★</div><p class="q">${r.t}”</p><div class="nm">${r.n}<br><span class="src">Google review</span></div></article>`);}
</script>
</body>
</html>
